<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天上掉大便</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* 天空蓝 */
            height: 100vh;
            position: relative;
        }
        
        .poop {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #8B4513; /* 棕色 */
            border-radius: 50% 50% 30% 30%;
            transform: rotate(45deg);
            top: -50px;
            z-index: 10;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .poop::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 15px;
            background-color: #A0522D;
            border-radius: 50%;
            top: -5px;
            left: 5px;
            transform: rotate(-15deg);
        }
        
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background-color: #228B22; /* 草地绿 */
            z-index: 5;
        }
        
        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 24px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="title">天上掉大便模拟器</div>
    <div class="ground"></div>

    <script>
        // 创建大便元素
        function createPoop() {
            const poop = document.createElement('div');
            poop.className = 'poop';
            
            // 随机水平位置
            const leftPos = Math.random() * window.innerWidth;
            poop.style.left = `${leftPos}px`;
            
            // 随机大小
            const size = 20 + Math.random() * 30;
            poop.style.width = `${size}px`;
            poop.style.height = `${size}px`;
            
            // 随机下落速度
            const speed = 1 + Math.random() * 3;
            
            document.body.appendChild(poop);
            
            // 动画效果
            let topPos = -50;
            const fall = () => {
                topPos += speed;
                poop.style.top = `${topPos}px`;
                
                // 旋转效果
                const rotation = parseFloat(poop.style.transform.replace('rotate(', '').replace('deg)', '')) || 45;
                poop.style.transform = `rotate(${rotation + 2}deg)`;
                
                // 移除超出屏幕的元素
                if (topPos < window.innerHeight) {
                    requestAnimationFrame(fall);
                } else {
                    poop.remove();
                    
                    // 落地效果
                    const splat = document.createElement('div');
                    splat.style.position = 'absolute';
                    splat.style.left = `${leftPos}px`;
                    splat.style.bottom = '100px';
                    splat.style.width = `${size * 1.5}px`;
                    splat.style.height = `${size * 0.5}px`;
                    splat.style.backgroundColor = '#5E2605';
                    splat.style.borderRadius = '50%';
                    splat.style.opacity = '0.8';
                    splat.style.zIndex = '8';
                    document.body.appendChild(splat);
                    
                    // 渐隐效果
                    let opacity = 0.8;
                    const fade = () => {
                        opacity -= 0.01;
                        splat.style.opacity = opacity;
                        if (opacity > 0) {
                            requestAnimationFrame(fade);
                        } else {
                            splat.remove();
                        }
                    };
                    setTimeout(() => requestAnimationFrame(fade), 1000);
                }
            };
            
            requestAnimationFrame(fall);
        }
        
        // 定期创建新大便
        setInterval(createPoop, 500);
        
        // 响应窗口大小变化
        window.addEventListener('resize', () => {
            const ground = document.querySelector('.ground');
            ground.style.height = `${window.innerHeight * 0.2}px`;
        });
    </script>
</body>
</html>
